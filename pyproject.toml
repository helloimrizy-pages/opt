[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olmoe-expert-domain-analysis"
version = "0.1.0"
description = "Domain-conditioned expert-importance diagnostics for OLMoE"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=2.19",
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "safetensors>=0.4",
  "accelerate>=0.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
